<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
  />
  <link rel="stylesheet" href="css/index_style.css">
  <title>WhatsApp Support</title>
  <script src="/socket.io/socket.io.js"></script>
</head>

<body>

  <div class="name-overlay" id="nameOverlay">
    <div class="name-box">
      <h2>Welcome!</h2>

      <p>
        Please enter your 10-digit mobile number to
        start chatting with our support team.
      </p>

      <input
        type="tel"
        id="userMobileInput"
        placeholder="Enter 10-digit mobile number"
        maxlength="10"
        minlength="10"
        inputmode="numeric"
        autocomplete="tel"
      />

      <button
        type="button"
        class="start-btn"
        id="startButton"
        onclick="startChat()"
      >
        Start Chat
      </button>
    </div>
  </div>

  <div class="chat-container">

    <div class="header">
      <div class="avatar">WA</div>

      <div class="user-info">
        <h4>Support Official</h4>

        <!-- ADMIN STATUS -->
        <div class="user-status">
          <span
            class="status-dot offline"
            id="statusDot"
          ></span>

          <span id="statusText">online</span>
        </div>
      </div>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="msg received" id="welcomeMessage">
        Hello! How can we help you?

        <span class="time">
          Just now
        </span>
      </div>
    </div>

    <div class="footer">
      <input
        type="text"
        id="msgInput"
        placeholder="Message..."
        autocomplete="off"
        onkeydown="handleKey(event)"
      />

      <button
        type="button"
        class="send-btn"
        onclick="sendMessage()"
      >
        ➤
      </button>
    </div>

  </div>
  <script src="js/index_script.js"></script>
</body>
</html>
