<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
<link rel="stylesheet" href="css/admin_style.css">
<title>Support Admin Panel</title>
<script src="/socket.io/socket.io.js"></script>
</head>

<body>
<div class="app">

  <div
    class="sidebar-overlay"
    id="sidebarOverlay"
    onclick="closeSidebar()"
  ></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">
        <h3 id="userTitle">All Users</h3>
        <p>Support conversations</p>
      </div>
    </div>

    <div id="userList"></div>
  </aside>

  <main class="chat-area">

    <header class="header" id="activeUserHeader">
      <button
        type="button"
        class="back-button"
        onclick="showUserList()"
        aria-label="Back to users"
      >‹</button>

      <div class="header-content">
        <div class="header-mobile">
          Select a user to chat
        </div>
      </div>

      <div class="header-status">
        Admin
      </div>
    </header>

    <div class="messages" id="adminChatBox">
      <div class="empty-chat">
        Select a user from the user list to view their conversation.
      </div>
    </div>

    <div class="input-bar">
      <input
        type="text"
        id="adminInput"
        placeholder="Type reply here..."
        autocomplete="off"
        onkeydown="handleKey(event)"
      />

      <button
        type="button"
        id="replyButton"
        onclick="sendReply()"
      >
        Reply
      </button>
    </div>

  </main>
</div>
<script src="js/admin_script.js"></script>
</body>
</html>
